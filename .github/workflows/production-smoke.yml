name: RTI Production Smoke Test

on:
  push:
    branches:
      - 'feature/production-smoke-20260927'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    name: External production smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Execute production smoke test
        env:
          SMOKE_BASE_URL: https://risetin.co.id
        run: node scripts/production-smoke.mjs

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rti-production-smoke-screenshots
          path: smoke-artifacts/
          if-no-files-found: ignore
