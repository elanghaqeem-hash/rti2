name: RTI Cloudflare Preview Deploy

on:
  push:
    branches:
      - 'feature/cloudflare-cutover-20260927'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rti-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy current rti2 to Workers preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight Cloudflare credentials
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Cloudflare credential variables are present."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run production readiness tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build OpenNext Worker
        run: npm run build

      - name: Verify Cloudflare identity
        run: npx --yes wrangler@4.141.0 whoami

      - name: Deploy Worker preview
        run: |
          set -o pipefail
          npx --yes wrangler@4.141.0 deploy 2>&1 | tee cloudflare-deploy.log

      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-preview-deploy-log
          path: cloudflare-deploy.log
          if-no-files-found: ignore
