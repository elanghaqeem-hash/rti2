name: RTICORE Dependency Security Remediation

on:
  push:
    branches:
      - feat/rticore-master-products-20261101

permissions:
  contents: write

concurrency:
  group: rticore-security-remediation
  cancel-in-progress: false

jobs:
  patch-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade Next.js to patched 15.5.28 and fix transitive advisories
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'dependencies.next=15.5.28'
          npm install --package-lock-only --no-audit --no-fund
          npm audit fix --package-lock-only --no-fund
          npm ci
          npm audit --omit=dev --audit-level=high
          npm test
          npm run typecheck
      - name: Commit security updates
        shell: bash
        run: |
          set -euo pipefail
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Already secure; no package change."
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(security): upgrade patched Next.js and audited dependencies'
            git push origin HEAD:feat/rticore-master-products-20261101
          fi
