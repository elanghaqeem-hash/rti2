name: Deploy RTI to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rti-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, provision D1, migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run integrity tests
        run: npm test

      - name: Run type checks
        run: npm run typecheck

      - name: Build OpenNext Cloudflare artifact
        run: npm run build:cloudflare

      - name: Deploy Worker and provision declared bindings
        run: npx wrangler deploy --keep-vars

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply rti-production --remote

      - name: Verify Enterprise Solution Finder configuration
        run: |
          npx wrangler d1 execute rti-production --remote --command             "SELECT
               (SELECT COUNT(*) FROM enterprise_finder_questions WHERE is_active = 1) AS questions,
               (SELECT COUNT(*) FROM enterprise_finder_services WHERE is_active = 1) AS services,
               (SELECT COUNT(*) FROM enterprise_finder_service_mappings WHERE is_active = 1) AS mappings;"

      - name: Deployment summary
        run: |
          echo "RTI Cloudflare deployment completed."
          echo "Worker: rti2"
          echo "D1 binding: RTI_DB"
          echo "D1 database: rti-production"
