name: RTI Cloudflare Staging Bootstrap (Optional)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    name: Cloudflare staging notice
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment target
        run: |
          echo "RTI production is configured for a standard Node.js server."
          echo "This workflow is retained only as an explicit/manual staging placeholder."
          echo "Do not store RTI production database or admin secrets in Cloudflare unless Cloudflare becomes the production runtime again."
